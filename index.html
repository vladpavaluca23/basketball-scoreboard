<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
</head>

<body>
    <div class="container">
        <div>
            <h3>HOME</h3>
            <div class="score" id="home-score">0</div>
            <div>
                <button onclick="add1Point()">+1</button>
                <button onclick="add2Point()">+2</button>
                <button onclick="add3Point()">+3</button>
            </div>
        </div>
        <div>
            <h3>GUEST</h3>
            <div class="score" id="guest-score">0</div>
            <div>
                <button onclick="guestAdd1Point()">+1</button>
                <button onclick="guestAdd2Point()">+2</button>
                <button onclick="guestAdd3Point()">+3</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
